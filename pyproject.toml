[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fald"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pygsp>=0.5.1",
    "scikit-learn>=1.2",
    "torch>=2.0",
]

[project.optional-dependencies]
# Importing DiGress's transformer layer pulls in src/utils.py, which imports these even though
# none of our code uses them. Without them `fald.models.adjacency_diffusion` cannot be
# instantiated and four tests fail at import time.
digress = [
    "torch_geometric>=2.4",
    "omegaconf>=2.3",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
include = ["fald*"]
