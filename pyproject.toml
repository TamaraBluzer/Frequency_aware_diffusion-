[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fald"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pygsp>=0.5.1",
    "scikit-learn>=1.2",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["fald*"]
